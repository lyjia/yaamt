# Linux release build pipeline.
# Runs on pushes to master/development (-> rolling nightly release).
# Versioned v*.*.* tag releases are built by GitHub Actions instead
# (.github/workflows/release.yml).
#
# Each step runs in its own container; only the workspace persists.
# Deps + build therefore live in a single step. The upload step only
# needs the stdlib and the artifacts left in the workspace.
#
# Trust tier: trusted. Has access to GITHUB_RELEASE_TOKEN.
# See doc/designs/ci.md.

when:
  - event: push
    branch: [master, development]

# Build only after the test workflow (.woodpecker/test.yaml) succeeds.
depends_on:
  - test

# Skip the references/ submodules (reference material only). Fetch
# tags explicitly: version stamping runs `git describe --tags` and
# must see release tags even on branch-push (nightly) builds.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      recursive: false
      tags: true

labels:
  platform: linux/amd64

steps:
  - name: build
    image: python:3.12
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      # --install-deps also installs a pinned nfpm (see build.py).
      - python build.py --install-deps
      - python build.py --release --archive --installer

  - name: upload
    image: python:3.12
    environment:
      GITHUB_RELEASE_TOKEN:
        from_secret: github_release_token
    commands:
      # Tag pushes -> versioned release; branch pushes -> rolling nightly.
      # Installers land in build/release-<timestamp>/ (see build.py).
      - python scripts/release_upload.py --repo lyjia/yaamt --tag nightly build/release-*/*.tar.gz build/release-*/*.deb build/release-*/*.rpm
    depends_on:
      - build
