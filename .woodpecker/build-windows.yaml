# Windows release build pipeline.
# Runs on pushes to master/development (-> rolling nightly release).
# Versioned v*.*.* tag releases are built by GitHub Actions instead
# (.github/workflows/release.yml).
#
# Trust tier: trusted. Has access to GITHUB_RELEASE_TOKEN.
# Runs on a self-hosted Windows agent using Woodpecker's *local* backend
# (no Docker). On the local backend the `image` field names the shell
# used to run the commands, not a container image. The agent must have
# Python 3.12, git, and Inno Setup pre-installed; see doc/designs/ci.md.

when:
  - event: push
    branch: [master, development]

# Build only after the test workflow (.woodpecker/test.yaml) succeeds.
depends_on:
  - test

# Skip the references/ submodules (reference material only). Fetch
# tags explicitly: version stamping runs `git describe --tags` and
# must see release tags even on branch-push (nightly) builds.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      recursive: false
      tags: true

labels:
  backend: local
  os: windows
  platform: windows/amd64

steps:
  - name: install-deps
    image: powershell
    commands:
      - python build.py --install-deps

  - name: build
    image: powershell
    commands:
      - python build.py --release --archive --installer
    depends_on:
      - install-deps

  - name: upload
    image: powershell
    environment:
      GITHUB_RELEASE_TOKEN:
        from_secret: github_release_token
    commands:
      # Installers land in build\release-<timestamp>\ (see build.py).
      - python scripts/release_upload.py --repo lyjia/yaamt --tag nightly (Get-ChildItem build\release-*\*-setup.exe).FullName (Get-ChildItem build\release-*\*.zip).FullName
    depends_on:
      - build
