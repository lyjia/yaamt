# Release build: Linux, Windows, and macOS artifacts for a v<M>.<m>.<p> tag.
#
# Triggers:
#   - pushing a release tag (v*.*.*)  -> build all platforms, publish to the
#     tag's GitHub Release
#   - workflow_dispatch with a tag    -> same, for re-running a release
#   - workflow_dispatch with a branch -> build + smoke test only (no publish);
#     use this to test packaging changes before tagging
#
# Lint + test CI stays on Woodpecker (doc/designs/ci.md). Release artifacts
# are uploaded as *release assets*, not Actions artifacts, so the Actions
# storage cap does not apply. Standard runners are free for public repos.
name: Release

on:
  push:
    tags: ["v*.*.*"]
    branches: ["claude/gracious-gauss-mr901i"]   # TEMPORARY: arm64 test run; remove before merge
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish (e.g. v0.1.0), or a branch to build without publishing"
        required: true
        type: string

permissions:
  contents: write   # lets the built-in GITHUB_TOKEN create/edit the release

jobs:
  build:
    name: build (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 (glibc 2.35) so the binaries run on older distros too.
          - platform: linux
            arch: x64
            os: ubuntu-22.04
            build_flags: --archive --installer
            artifacts: "*.tar.gz *.deb *.rpm"
          - platform: linux
            arch: arm64
            os: ubuntu-22.04-arm
            build_flags: --archive --installer
            artifacts: "*.tar.gz *.deb *.rpm"
          - platform: windows
            arch: x64
            os: windows-latest
            build_flags: --archive --installer
            artifacts: "*.zip *-setup.exe"
          # macos-14 is Apple Silicon -> arm64. Add macos-13 for x64.
          - platform: macos
            arch: arm64
            os: macos-14
            build_flags: --installer
            artifacts: "*.dmg"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          # Full history + tags: version.py runs `git describe --tags --long`
          # to stamp the build. A shallow clone would mis-stamp the version.
          fetch-depth: 0
          submodules: false   # references/ is reference material only

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version and publish mode
        id: meta
        run: |
          VER=$(cd src && python -m util.version | tr -d '\r')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Build will stamp version: $VER"
          if git show-ref --verify --quiet "refs/tags/$REF"; then
            # Never publish a non-release build: on a tag the version must be bare M.m.p.
            case "$VER" in
              *+*|*dirty*)
                echo "::error::Version '$VER' is not a clean release build for tag $REF."
                exit 1 ;;
            esac
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$REF is not a tag; building and testing without publishing."
          fi

      - name: Install dependencies
        run: python build.py --install-deps

      - name: Build release
        run: python build.py --release ${{ matrix.build_flags }}

      - name: List artifacts
        run: |
          cd build/release-*/
          du -sh yaamt
          ls -la ${{ matrix.artifacts }}

      # --- Smoke tests: the raw PyInstaller output, then the installed package.

      - name: Smoke test (bundle)
        if: matrix.platform != 'macos'
        run: python scripts/smoke_test.py build/release-*/yaamt --expect-version "${{ steps.meta.outputs.version }}"

      - name: Smoke test (installed .deb)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y ./build/release-*/*.deb
          test "$(yaamt --version | tail -n1)" = "${{ steps.meta.outputs.version }}"
          python scripts/smoke_test.py /usr/lib/yaamt --expect-version "${{ steps.meta.outputs.version }}"

      - name: Smoke test (installed setup.exe)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem build\release-*\*-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "yaamt-install"
          Start-Process -Wait -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`""
          python scripts/smoke_test.py $dir --expect-version "${{ steps.meta.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test (.app inside .dmg)
        if: matrix.platform == 'macos'
        run: |
          MOUNT=$(mktemp -d)
          hdiutil attach build/release-*/*.dmg -mountpoint "$MOUNT" -nobrowse -readonly
          trap 'hdiutil detach "$MOUNT"' EXIT
          ls -la "$MOUNT"
          codesign --verify --deep --strict --verbose=2 "$MOUNT/YAAMT.app"
          plutil -p "$MOUNT/YAAMT.app/Contents/Info.plist"
          python scripts/smoke_test.py "$MOUNT/YAAMT.app/Contents/MacOS" --expect-version "${{ steps.meta.outputs.version }}"

      - name: Upload to the GitHub Release
        if: steps.meta.outputs.publish == 'true'
        env:
          GITHUB_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/release-*/
          python ../../scripts/release_upload.py --repo "${{ github.repository }}" --tag "$REF" ${{ matrix.artifacts }}
